<style>

<script>
(()=>{
'use strict';
const PI=Math.PI,TAU=PI*2;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const ROMAN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
const roman=n=>ROMAN[n]||String(n);
const LAST_WAVE=13;
const $=id=>document.getElementById(id);

/* ---------- płótno ---------- */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,zoom=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);zoom=clamp(Math.min(W,H)/520,.6,1.4)}
addEventListener('resize',resize);resize();

/* ---------- pole bitwy (rysowane raz, krew zostaje na ziemi) ---------- */
const AS=3400,AC=1700,AR=1600,OFF=800;let OX=0,level=0;
const G=document.createElement('canvas');G.width=G.height=AS;const g=G.getContext('2d');
function stuckSword(x,y){
  const t=rand(-.4,.4),L=rand(30,58),ux=Math.sin(t),uy=-Math.cos(t);

function weatherTick(dt){
  const pr=WX_PRESET[level];WX.t-=dt;
  if(WX.t<=0){WX.t=rand(12,26);WX.rainT=rand(pr.rain[0],pr.rain[1]);WX.windT=rand(pr.wind[0],pr.wind[1])}
  WX.gust=Math.max(0,WX.gust-dt*.45);if(Math.random()<dt*.07)WX.gust=rand(.5,1);
  WX.rain+=(WX.rainT-WX.rain)*Math.min(1,dt*.25);WX.wind+=(WX.windT-WX.wind)*Math.min(1,dt*.35);WX.w=WX.wind*(1+WX.gust*1.4);
  WX.boltT-=dt*pr.storm*(.35+WX.rain);if(WX.boltT<=0&&state==='play'){WX.boltT=rand(8,20);lightning()}

  for(const f of flies){f.ph+=dt*f.sp;f.x=f.hx+Math.sin(f.ph*1.3)*40+Math.sin(f.ph*.4)*30;f.y=f.hy+Math.cos(f.ph)*22-18}

function drawGroundWeather(c,vw,vh){

  c.lineWidth=1.2;c.lineCap='round';c.strokeStyle=pr.grass;c.beginPath();
  const x0=cam.x-vw/2-30,x1=cam.x+vw/2+30,y0=cam.y-vh/2-30,y1=cam.y+vh/2+40;
  for(const gr of GRASS){if(gr.y<y0)continue;if(gr.y>y1)break;if(gr.x<x0||gr.x>x1)continue;
    let bend=Math.sin(time*(1.4+Math.abs(w))+gr.ph)*.12+w*.32;const dx=gr.x-P.x,dy=gr.y-P.y,d=Math.abs(dx)+Math.abs(dy);if(d<34)bend+=Math.sign(dx||1)*(1-d/34)*.9;
    for(let k=0;k<gr.n;k++){const bx=gr.x+(k-gr.n/2)*gr.sp*.35,h=gr.h*(.7+((k*37)%10)/30),a=bend+(k-gr.n/2)*.12;c.moveTo(bx,gr.y);c.quadraticCurveTo(bx+a*h*.3,gr.y-h*.6,bx+Math.sin(a)*h,gr.y-Math.cos(a)*h)}}
  c.stroke();
  if(level===2){c.fillStyle='rgba(40,30,20,.85)';for(const gr of GRASS){if(!gr.reed||gr.y<y0||gr.y>y1||gr.x<x0||gr.x>x1)continue;const a=Math.sin(time*1.6+gr.ph)*.12+w*.32;c.beginPath();c.ellipse(gr.x+Math.sin(a)*gr.h,gr.y-Math.cos(a)*gr.h-3,1.8,4.5,a,0,TAU);c.fill()}}

}

function jobTick(n,dt,dx,dy,d){

  else if(d<120&&!P.dead){n.act='look';n.faceLock=Math.atan2(-dy,-dx);if(!n.saidT||time-n.saidT>14){n.saidT=time;const L=n.sayL||SAY[n.job]||SAY.any;n.say=L[(Math.random()*L.length)|0];n.sayT=3.2}}
  else if(n.wps){const wp=n.wps[n.wi],tx=wp[0]-n.x,ty=wp[1]-n.y,td=Math.hypot(tx,ty);
    if(td<6){n.act='work';n.wait-=dt;n.faceLock=n.wf!=null?n.wf:n.face;if(n.wait<=0){n.wi=(n.wi+1)%n.wps.length;n.wait=n.wt0||2}}else{vx=tx/td*sp;vy=ty/td*sp}}

  else if(n.px!=null){const tx=n.px-n.x,ty=n.py-n.y,td=Math.hypot(tx,ty);if(td>5){vx=tx/td*sp;vy=ty/td*sp}else{n.act='work';n.faceLock=n.wf}}
  n.x+=vx*dt;n.y+=vy*dt;n.mv=Math.hypot(vx,vy);
  if(n.sayT>0)n.sayT-=dt;if((n.act==='look'||n.act==='work')&&n.faceLock!=null)n.face=n.faceLock;else if(n.mv>1)n.face=Math.atan2(vy,vx);

function waveList(n0){
  const n=n0<=6?n0:6+Math.round((n0-6)*4/7),L=[];const total=Math.round(4+n*3.2);
  const kol=n>=2?Math.floor(n/2):0,up=n>=3?Math.floor((n-1)/2)+(n>6?1:0):0;
  const tar=n>=2?Math.min(7,Math.floor(n/2)+(n>=5?1:0)):0;for(let i=0;i<tar;i++)L.push('tarcz');
  for(let i=0;i<kol;i++)L.push('kolos');for(let i=0;i<up;i++)L.push('upior');
  if(n>=4&&n<=6)for(let i=0;i<3+(n-4)*2;i++)L.push('wilk');
  if(n>=7)for(let i=0;i<3+(n-7)*2;i++)L.push('topiel');
  while(L.length<total)L.push('ghul');
  for(let i=L.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[L[i],L[j]]=[L[j],L[i]]}
  if(n0===3||n0===9)L.splice(Math.floor(L.length*.5),0,'rycerz');
  if(n0===6)L.splice(Math.floor(L.length*.5),0,'alfa');
  if(n0===LAST_WAVE)L.splice(Math.floor(L.length*.4),0,'boss');
  return L;
}

function nearestAim(){
  let best=null,bs=1e9;
  for(const e of enemies){if(e.spawnT>0)continue;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy);if(d>320)continue;
    const a=Math.atan2(dy,dx);const s=d+Math.abs(angDiff(a,P.face))*70;if(s<bs){bs=s;best=a}}
  return best;
}
function pickAim(){
  if(aimMouse){const wx=cam.x+(mouse.x-W/2)/zoom,wy=cam.y+(mouse.y-H/2)/zoom;return Math.atan2(wy-P.y,wx-P.x)}
  const iv=inputVec();
  if(iv.m>.35){const ia=Math.atan2(iv.y,iv.x);let best=null,bs=1e9;
    for(const e of enemies){if(e.spawnT>0||e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy);if(d>300)continue;const a=Math.atan2(dy,dx),df=Math.abs(angDiff(a,ia));if(df>1.0)continue;const sc=d+df*120;if(sc<bs){bs=sc;best=a}}
    return best!==null?best:ia}
  const n=nearestAim();if(n!==null)return n;
  return P.face;
}

function bleed(x,y,a,n,pow){

    blood.push({x,y,z:rand(10,28),vx:Math.cos(aa)*v,vy:Math.sin(aa)*v,vz:rand(60,260),r:rand(1.2,3.4)})}
}
function hitEnemy(e,dmg,kbAng,heavy,cutAng,kb,noCombo){
  if(e.dead)return;

  camKick.x+=Math.cos(kbAng)*(heavy?7:4);camKick.y+=Math.sin(kbAng)*(heavy?7:4);

  if(!noCombo){P.cN++;P.cT=2.4;if(P.cN>bestCombo)bestCombo=P.cN;dmg*=1+Math.min(P.cN,40)*.01;
    if(P.cN===10||P.cN===25||P.cN===50||P.cN===100){sfx.bell();const el=$('combo');el.style.transform='scale(1.25)';setTimeout(()=>el.style.transform='',160)}}

  e.vx+=Math.cos(kbAng)*k;e.vy+=Math.sin(kbAng)*k;

function update(dt){
  time+=dt;storyTick(dt);
  if(whisperT>0){whisperT-=dt;if(whisperT<=0&&!story)$('cap').classList.remove('on')}
  updateHero(dt);
  attackers=0;for(const e of enemies)if(e.type==='ghul'&&(e.state==='wind'||e.state==='atk'))attackers++;
  const capFreeze=!!(story&&story.capActive);if(capFreeze)P.inv=Math.max(P.inv,.9);
  if(!capFreeze)for(const e of enemies)updateEnemy(e,dt);
  // rozpychanie się potworów
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.spawnT>0)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.spawnT>0)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d<m&&d>0){const p=(m-d)/2,ux=dx/d,uy=dy/d,wa=a.type==='kolos'?.25:1,wb=b.type==='kolos'?.25:1;a.x-=ux*p*wa;a.y-=uy*p*wa;b.x+=ux*p*wb;b.y+=uy*p*wb}}}
  enemies=enemies.filter(e=>!e.dead);
  // pociski
  if(!capFreeze)for(const pr of projs){pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;if(Math.random()<.6)fx.push({x:pr.x,y:pr.y,vx:rand(-10,10),vy:rand(-10,10),life:.35,max:.35,size:rand(3,6),col:'wisp'});
    if(!pr.dead&&Math.hypot(pr.x-P.x,pr.y-(P.y-16))<P.r+8){pr.dead=true;hurtPlayer(12+wave*.5,pr.x-pr.vx,pr.y-pr.vy)}
    if(hitObs(pr.x,pr.y+20,0)){pr.dead=true;for(let i=0;i<6;i++)fx.push({x:pr.x,y:pr.y,vx:rand(-60,60),vy:rand(-60,60),life:.3,max:.3,size:3,col:'wisp'})}
    if(pr.life<=0||Math.hypot(pr.x-AC,pr.y-AC)>AR)pr.dead=true}
  projs=projs.filter(p=>!p.dead);
  for(const b of bombs){b.t+=dt;const k=Math.min(1,b.t/b.dur);b.x=lerp(b.x0,b.tx,k);b.y=lerp(b.y0,b.ty,k);b.z=Math.sin(k*PI)*70;if(k>=1){b.dead=true;explode(b.tx,b.ty)}}
  bombs=bombs.filter(b=>!b.dead);
  for(const kn of knives){kn.life-=dt;kn.x+=Math.cos(kn.a)*720*dt;kn.y+=Math.sin(kn.a)*720*dt;
    for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(Math.hypot(e.x-kn.x,e.y-DEF[e.type].cy*e.s-kn.y)<e.r+8){hitEnemy(e,22,kn.a,false,kn.a+PI/2,140);kn.hit=true;break}}
    if(hitObs(kn.x,kn.y+18,0)){kn.dead=true;sfx.clank()}
    if(kn.hit||kn.life<=0)kn.dead=true}
  knives=knives.filter(k=>!k.dead);
  for(const bl of blades){bl.life-=dt;bl.x+=Math.cos(bl.a)*bl.v*dt;bl.y+=Math.sin(bl.a)*bl.v*dt;
    for(const e of enemies){if(e.dead||e.spawnT>0||bl.hit.has(e))continue;if(Math.hypot(e.x-bl.x,e.y-bl.y)<e.r+36){bl.hit.add(e);hitEnemy(e,bl.dmg,bl.a,false,bl.a+PI/2,220)}}
    if(bl.life<=0)bl.dead=true}
  blades=blades.filter(b=>!b.dead);
  for(const q of quakes){q.t-=dt;if(q.t<=0){q.dead=true;const R=58;
    for(const e of enemies){if(e.dead||e.spawnT>0)continue;if(Math.hypot(e.x-q.x,e.y-q.y)<R+e.r)hitEnemy(e,42*techMul(),Math.atan2(e.y-q.y,e.x-q.x)-PI/2*0+0,true,rand(0,TAU),360,true)}
    cracks(q.x,q.y,R*.9);shake=Math.max(shake,7);sfx.slam();
    for(let i=0;i<14;i++){const aa=rand(0,TAU),v=rand(60,200);fx.push({x:q.x,y:q.y,vx:Math.cos(aa)*v,vy:Math.sin(aa)*v*.5-60,life:rand(.4,.8),max:.8,size:rand(6,14),col:'dust'})}
    for(let i=0;i<6;i++)fx.push({x:q.x+rand(-10,10),y:q.y,vx:rand(-30,30),vy:rand(-160,-60),life:.4,max:.4,size:3,col:'ember'})}}
  quakes=quakes.filter(q=>!q.dead);
  // fale
  if(state==='play'&&!P.dead&&!story){
    const act=enemies.reduce((n,e)=>n+(e.lurk?0:1),0);
    if(endless){
      if(interT>0){interT-=dt;if(interT<=0)startWave(wave+1)}
      else if(wave>0){spawnCD-=dt;const cap=10+wave*1.5;
        if(queue.length&&spawnCD<=0&&act<cap){spawn(queue.shift());spawnCD=Math.max(.28,1.05-wave*.07)}
        if(!queue.length&&!act){P.hp=Math.min(P.maxhp,P.hp+15);addFame(10);dropLoot(P.x+rand(-90,90),P.y+rand(-90,90));interT=3.8;banner(`Fala ${roman(wave)} przetrwana`,'Noc się nie kończy',2.6)}}
    }else if(fighting){spawnCD-=dt;const cap=10+wave*1.5;
      if(queue.length&&spawnCD<=0&&act<cap){spawn(queue.shift());spawnCD=Math.max(.28,1.05-wave*.07)}
      if(!queue.length&&!act){fighting=false;siteCleared()}}
    else routeTick(dt);
  }
  if(state==='play'){npcTick(dt);interiorTick(dt);defenseTick(dt);evTick(dt);shopTick(dt)}
  updateFx(dt);
}
function updateFx(dt){
  for(const b of blood){b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.vz-=950*dt;b.vx*=.985;b.vy*=.985;if(b.z<=0){splat(b.x,b.y,b.r*rand(1.2,2.6),rand(.35,.7));b.dead=true}}
  blood=blood.filter(b=>!b.dead);
  for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;f.vx*=.95;f.vy*=.95}
  fx=fx.filter(f=>f.life>0);if(fx.length>500)fx.splice(0,fx.length-500);
  for(const p of pieces){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.exp(-dt*4.5);p.vx*=f;p.vy*=f;p.rot+=p.vr*dt;p.vr*=f;
    if(p.t<.45&&Math.random()<.7){if(blood.length<700)blood.push({x:p.x,y:p.y,z:6,vx:rand(-40,40)+p.vx*.3,vy:rand(-40,40)+p.vy*.3,vz:rand(30,120),r:rand(1.2,2.6)})}
    if(p.t>1.1){stampPiece(p);p.dead=true}}
  pieces=pieces.filter(p=>!p.dead);
  for(const f of fog){f.x+=(f.vx+WX.w*30)*dt;f.y+=f.vy*dt;if(f.x<-300)f.x=AS+300;if(f.x>AS+300)f.x=-300;if(f.y<-300)f.y=AS+300;if(f.y>AS+300)f.y=-300}
  flash=Math.max(0,flash-dt*3.5);weatherTick(dt);
  for(const c of crows){c.t+=dt;const d=Math.hypot(P.x-c.x,P.y-c.y);
    if(c.fly<=0&&(d<130||(enemies.some(e=>!e.spawnT&&Math.abs(e.x-c.x)<60&&Math.abs(e.y-c.y)<60)))){c.fly=rand(4,7);const a=Math.atan2(c.y-P.y,c.x-P.x)+rand(-.6,.6),v=rand(160,240);c.vx=Math.cos(a)*v;c.vy=Math.sin(a)*v;if(Math.random()<.25)sfx.caw()}
    if(c.fly>0){c.fly-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.z=Math.min(140,c.z+dt*160);if(c.fly<=0){c.x=c.hx;c.y=c.hy;c.z=0}}}
  for(const a of ash){a.y+=a.v*dt;a.x+=Math.sin(time*.7+a.w)*.004*dt*10;if(a.y>1.05){a.y=-.05;a.x=Math.random()}}
  shake=Math.max(0,shake-dt*40);hurtV=Math.max(0,hurtV-dt*1.6);
}
